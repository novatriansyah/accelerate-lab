name: Master CD (Deploy to Hostinger)

on:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Zero-Downtime Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Required Deployment Secrets
        run: |
          MISSING_SECRETS=""
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then MISSING_SECRETS="${MISSING_SECRETS} SSH_PRIVATE_KEY"; fi
          if [ -z "${{ secrets.SSH_HOST }}" ]; then MISSING_SECRETS="${MISSING_SECRETS} SSH_HOST"; fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then MISSING_SECRETS="${MISSING_SECRETS} SSH_USER"; fi
          if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then MISSING_SECRETS="${MISSING_SECRETS} DEPLOY_PATH"; fi

          if [ -n "${MISSING_SECRETS}" ]; then
            echo "::error::Missing GitHub Secrets:${MISSING_SECRETS}"
            echo "--------------------------------------------------------------------------------"
            echo "Action Required: Go to GitHub Repository -> Settings -> Secrets and variables -> Actions"
            echo "Add the following secrets:${MISSING_SECRETS}"
            echo "--------------------------------------------------------------------------------"
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, zip
          tools: composer:v2

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Production Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build Production NPM Assets
        run: |
          npm ci
          npm run build

      - name: Setup SSH Authentication
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Execute Zero-Downtime Release Deployment
        run: |
          set -e
          RELEASE_NAME=$(date +'%Y%m%d%H%M%S')
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          SHARED_DIR="${DEPLOY_PATH}/shared"
          RELEASES_DIR="${DEPLOY_PATH}/releases"
          RELEASE_PATH="${RELEASES_DIR}/${RELEASE_NAME}"
          SSH_PORT="${{ secrets.SSH_PORT || '65002' }}"
          SSH_USER="${{ secrets.SSH_USER }}"
          SSH_HOST="${{ secrets.SSH_HOST }}"

          echo "🚀 Starting release deployment: ${RELEASE_NAME}"

          # Ensure persistent shared directories and releases root exist
          ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "
            set -e
            mkdir -p ${SHARED_DIR}/storage/app/public
            mkdir -p ${SHARED_DIR}/storage/framework/cache
            mkdir -p ${SHARED_DIR}/storage/framework/sessions
            mkdir -p ${SHARED_DIR}/storage/framework/views
            mkdir -p ${SHARED_DIR}/storage/logs
            mkdir -p ${RELEASES_DIR}/${RELEASE_NAME}
          "

          # Rsync application code to release directory
          rsync -avz -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='storage/' \
            --exclude='public/storage' \
            ./ ${SSH_USER}@${SSH_HOST}:${RELEASE_PATH}/

          # Execute release configuration, migrations, symlinking, and release retention
          ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} "
            set -e

            # Ensure shared environment configuration exists
            if [ ! -f '${SHARED_DIR}/.env' ]; then
              if [ -f '${DEPLOY_PATH}/.env' ]; then
                cp '${DEPLOY_PATH}/.env' '${SHARED_DIR}/.env'
              else
                touch '${SHARED_DIR}/.env'
              fi
            fi

            cd '${RELEASE_PATH}'

            # Link persistent environment file
            ln -sf ../../shared/.env .env

            # Link persistent storage directory
            rm -rf storage
            ln -sf ../../shared/storage storage

            # Create storage symlink in public directory (bypassing PHP exec restriction)
            rm -rf public/storage
            ln -sf ../../shared/storage/app/public public/storage

            # Run database migrations
            php artisan migrate --force

            # Optimize application caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Set file permissions on shared storage and bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Ensure 'current' is a direct symlink pointing to the latest release
            cd '${DEPLOY_PATH}'
            rm -rf current
            ln -sfn "releases/${RELEASE_NAME}" current

            # Prune old releases, keeping only the 5 most recent
            cd '${RELEASES_DIR}'
            ls -1t | tail -n +6 | xargs -r rm -rf
          "
          echo "✅ Release ${RELEASE_NAME} deployed successfully!"
